name: Flujo UVUS - PKF2894

on:
  issues:
    types: [opened, edited]
  project_card:
    types: [moved]
  workflow_dispatch:

jobs:
  uvus-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar información del evento
        uses: actions/github-script@v7
        with:
          script: |
            console.log("Evento recibido:", context.eventName);
            console.log("Repositorio:", context.repo.repo);
            console.log("Usuario:", context.actor);
